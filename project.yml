name: ContactLogo

options:
  bundleIdPrefix: com.contactlogo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "ContactLogo"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    GENERATE_INFOPLIST_FILE: YES

targets:
  ContactLogoKit:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ContactLogoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contactlogo.kit
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  ContactLogoKitMac:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContactLogoKit
    settings:
      base:
        PRODUCT_NAME: ContactLogoKit
        PRODUCT_MODULE_NAME: ContactLogoKit
        PRODUCT_BUNDLE_IDENTIFIER: com.contactlogo.kit.macos
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  ContactLogoiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/ContactLogoiOS
    dependencies:
      - target: ContactLogoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contactlogo
        PRODUCT_NAME: "ContactLogo"
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "ContactLogo"
        INFOPLIST_KEY_NSContactsUsageDescription: "ContactLogo scans your contacts to find company logos for businesses in your address book."
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: "com.contactlogo.match"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ContactLogoMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/ContactLogoMac
    dependencies:
      - target: ContactLogoKitMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contactlogo.macos
        PRODUCT_NAME: "ContactLogo"
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "ContactLogo"
        INFOPLIST_KEY_NSContactsUsageDescription: "ContactLogo scans your contacts to find company logos for businesses in your address book."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Apps/ContactLogoMac/ContactLogoMac.entitlements
